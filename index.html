<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NX — ดูซีรี่ส์ & อนิเมะฟรี</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui;background:#0b0e14;color:#eee;max-width:1000px;margin:auto;padding:16px}
.hero{background:linear-gradient(135deg,#12233a,#1d1030);border-radius:16px;padding:28px 22px;margin-bottom:14px}
.hero h1{margin:0 0 6px;font-size:28px}.hero p{color:#9fb3c8;margin:0 0 14px}
.srcs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.src{font-size:12px;background:#1c2940;border:1px solid #2d4266;border-radius:20px;padding:4px 12px;color:#9fc2ff}
input[type=text]{width:70%;padding:12px;border-radius:10px;border:1px solid #333;background:#161c28;color:#eee}
button{padding:12px 18px;cursor:pointer;border-radius:10px;border:0;background:#1f6feb;color:#fff;font-weight:600}
button.ghost{background:#222}
.row{display:flex;gap:8px;margin:12px 0;align-items:center}.note{color:#8a94a6;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chips button{background:#1a2333;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0}
.card{background:#151b28;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid #232d45}
.card:hover{border-color:#1f6feb}.card img{width:100%;height:200px;object-fit:cover;background:#222}
.card div{padding:8px;font-size:12px}.card .badge{color:#7ee2a8;font-size:11px}
.web{margin:8px 0;font-size:14px}.web a{color:#7cf;display:block;padding:7px 0;border-bottom:1px solid #222;text-decoration:none}
video{width:100%;background:#000;margin-top:12px;border-radius:12px}
.eps{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;max-height:300px;overflow:auto}
.eps button{padding:8px 12px;min-width:64px;background:#222}.eps button.cur{background:#0a7}
.nowbar{display:flex;align-items:center;gap:8px;background:#10251a;border:1px solid #0a7;border-radius:10px;padding:8px 12px;margin-top:8px}
.nowbar b{flex:1}
.keyrow{margin-top:10px;font-size:12px;color:#8a94a6}input[type=password]{padding:8px;border-radius:8px;border:1px solid #333;background:#161c28;color:#eee;width:280px}
h3{margin:18px 0 4px}footer{font-size:12px;margin:24px 0;text-align:center;color:#5a6778}
</style></head>
<body>
<div class="hero">
<h1>⚡ NX</h1>
<p>ค้นหาซีรี่ส์ + อนิเมะจากเว็บฟรีทั่วเน็ต แล้วดูแบบไร้โฆษณาในที่เดียว</p>
<div class="row">
<input type="text" id="q" placeholder="🔍 ชื่อเรื่อง... (เช่น โลกอันสมบูรณ์แบบ, One Piece)">
<button onclick="search()">ค้นหา</button>
</div>
<div class="chips">
<button onclick="preset('ซีรี่ส์จีนพากย์ไทย')">🇨🇳 ซีรี่ส์จีน</button>
<button onclick="preset('ซีรี่ส์เกาหลีซับไทย')">🇰🇷 ซีรี่ส์เกาหลี</button>
<button onclick="preset('อนิเมะซับไทย')">🇯🇵 อนิเมะ</button>
<button onclick="preset('Perfect World โลกอันสมบูรณ์แบบ')">✨ โลกอันสมบูรณ์แบบ</button>
<button onclick="preset('ดูหนังใหม่ 2026 พากย์ไทย')">🎬 หนังใหม่ 2026</button>
<button onclick="preset('หนังชนโรง 2026')">🍿 หนังชนโรง</button>
<button onclick="preset('ซีรี่ส์ไทย 2026')">🇹🇭 ซีรี่ส์ไทย</button>
</div>
<div class="srcs"><span class="note">แหล่งเบื้องหลัง:</span><span class="src">anime-hit</span><span class="src">037HD</span><span class="src">AnimePahe</span><span class="src">YouTube</span><span class="src">+ทั่วเน็ต</span></div>
<div class="keyrow">🔑 Exa key (ผลแม่นขึ้น ไม่บังคับ — เก็บในเครื่องนี้เท่านั้น): <input type="password" id="exakey" placeholder="วาง key แล้ว Enter"> <span id="keystat"></span></div>
</div>
<div id="results" class="grid"></div>
<h3 id="webhead" style="display:none">🌐 จากทั่วเน็ต</h3>
<div id="webres" class="web"></div>
<div id="epsec" style="display:none">
<h3 id="eptitle"></h3>
<div class="row"><button class="ghost" onclick="toggleOrder()" id="ordbtn">เรียง: เก่า → ใหม่</button><span class="note" id="epcount"></span></div>
<div id="eps" class="eps"></div>
</div>
<div class="row">
<input type="text" id="u" placeholder="หรือวางลิงก์ตรง...">
<button onclick="resolve()">ดูแบบคลีน</button>
</div>
<video id="v" controls playsinline></video>
<iframe id="yt" style="display:none;width:100%;height:70vh;border:0" allowfullscreen allow="autoplay; encrypted-media"></iframe>
<div class="nowbar" id="nowbar" style="display:none">
<button id="prevbtn" onclick="stepEp(-1)">◀ ตอนก่อน</button><b id="nowtxt">-</b><button id="nextbtn" onclick="stepEp(1)">ตอนถัดไป ▶</button>
</div>
<div class="row">
<button onclick="skipIntro()">⏩ ข้ามเพลงเปิด (<span id="skipval">2:00</span>)</button>
<input id="skip" type="range" min="0" max="600" step="5" value="120" style="flex:1" oninput="document.getElementById('skipval').textContent=fmtT(this.value)">
</div>
<div class="row" id="directbox" style="display:none">
<span class="note" id="directurl" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
<button class="ghost" onclick="copyDirect()">📋 ก็อปลิงก์</button>
</div>
<footer>NX • static 100% • ดูบนมือถือ / Smart TV ได้ • ข้อมูลจากเว็บฟรี</footer>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
const PROXY='https://cors.eu.org/',BASE='https://anime-hit.com';
const u=()=>document.getElementById('u').value.trim();
const exaKey=()=>localStorage.getItem('exa_key')||'';
if(exaKey()){document.getElementById('exakey').value=exaKey();document.getElementById('keystat').textContent='✅ จำแล้ว';}
document.getElementById('exakey').addEventListener('keydown',e=>{if(e.key==='Enter'){localStorage.setItem('exa_key',e.target.value.trim());document.getElementById('keystat').textContent='✅ จำแล้ว';}});
async function pGet(url){const r=await fetch(PROXY+url);if(!r.ok)throw new Error('โหลดไม่ได้ '+r.status);return r.text();}
function hostOf(url){try{return new URL(url).hostname.replace(/^www\./,'')}catch(e){return''}}
function play(src){
  document.getElementById('yt').style.display='none';const v=document.getElementById('v');v.style.display='block';
  if(window._hls){try{window._hls.destroy()}catch(e){}window._hls=null}
  v.pause();v.removeAttribute('src');v.load();
  if(src.includes('.m3u8')&&window.Hls&&Hls.isSupported()){const h=new Hls();window._hls=h;h.loadSource(src);h.attachMedia(v);v.play().catch(()=>{});}
  else{v.src=src;v.play().catch(()=>{});}
}
function playYT(id){document.getElementById('v').style.display='none';const f=document.getElementById('yt');f.style.display='block';f.src='https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0';}
function ytId(url){const m=url.match(/[?&]v=([\w-]{6,})/)||url.match(/youtu\.be\/([\w-]{6,})/)||url.match(/\/embed\/([\w-]{6,})/);return m?m[1]:null;}
const BAD=['googlesyndication','doubleclick','sa168','huayhit','vast','preroll'];
async function resolveUrl(pageUrl){
  if(/\.(m3u8|mp4)(\?|$)/.test(pageUrl))return{src:pageUrl};
  if(/youtube|youtu\.be/.test(pageUrl)){const id=ytId(pageUrl);if(id)return{yt:id};}
  const html=await pGet(pageUrl),doc=new DOMParser().parseFromString(html,'text/html');
  for(const f of doc.querySelectorAll('iframe')){
    const emb=f.getAttribute('src')||f.getAttribute('data-src')||'';
    if(!emb.startsWith('http')||BAD.some(b=>emb.includes(b)))continue;
    try{
      const eh=await pGet(emb);
      const vids=[...(eh.matchAll(/https?:\/\/[^"'\\\s]+\.m3u8[^"'\\\s]*/g))].map(m=>m[0]);
      const mp4s=[...(eh.matchAll(/https?:\/\/[^"'\\\s]+\.mp4[^"'\\\s]*/g))].map(m=>m[0]).filter(x=>!BAD.some(b=>x.includes(b)));
      if(vids.length||mp4s.length)return{src:vids.concat(mp4s)[0]};
    }catch(e){}
  }
  const vs=[...doc.querySelectorAll('video source, video')].map(v=>v.getAttribute('src')||'').filter(s=>s.startsWith('http'));
  if(vs.length)return{src:vs[0]};
  throw new Error('เว็บนี้ขุดตรงไม่ได้ ลองเปิดต้นทางเอง');
}
async function resolve(){
  try{
    const j=await resolveUrl(u());
    if(j.yt)playYT(j.yt);else{play(j.src);LAST_DIRECT=j.src;
      document.getElementById('directbox').style.display='flex';
      document.getElementById('directurl').textContent=j.src.slice(0,70)+'…';}
    if(!CUR.label||CUR.idx<0&&!EP.length)setNow(u(),-1);
  }catch(e){alert(e.message)}
}
let LAST_DIRECT='';
function copyDirect(){navigator.clipboard.writeText(LAST_DIRECT).then(()=>alert('ก็อปลิงก์แล้ว'))}
let EP=[],ASC=true,CUR={label:'',idx:-1},EPTITLE='';
function setNow(l,i){CUR={label:l,idx:i};document.getElementById('nowbar').style.display='flex';
  document.getElementById('nowtxt').textContent='▶ กำลังดู: '+l;
  const h=EP.length>0&&i>=0;document.getElementById('prevbtn').disabled=!h||i<=0;document.getElementById('nextbtn').disabled=!h||i>=EP.length-1;}
function playEp(e,i){[...document.getElementById('eps').children].forEach(b=>b.classList.toggle('cur',b.textContent==='EP.'+e.ep));
  document.getElementById('u').value=e.url;setNow((EPTITLE?EPTITLE+' — ':'')+'EP.'+e.ep,i);resolve();}
function stepEp(d){if(CUR.idx<0||!EP.length)return;const n=CUR.idx+d;if(n<0||n>=EP.length)return;playEp(EP[n],n);}
function toggleOrder(){ASC=!ASC;renderEps();}
function fmtT(s){s=+s;return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function skipIntro(){const v=document.getElementById('v');v.currentTime=Math.min(v.currentTime+(+document.getElementById('skip').value),(v.duration||1e9)-2);}
function preset(q){document.getElementById('q').value=q;search();}
async function search(){
  const q=document.getElementById('q').value.trim();if(!q)return;
  searchHit(q);searchWeb(q);
}
async function searchHit(q){
  try{
    const html=await pGet(BASE+'/?s='+encodeURIComponent(q));
    const doc=new DOMParser().parseFromString(html,'text/html');
    const g=document.getElementById('results');g.innerHTML='';const seen=new Set();
    [...doc.querySelectorAll('article')].forEach(a=>{
      const link=a.querySelector('a[rel="bookmark"]')||a.querySelector('a[href]');
      if(!link)return;const url=link.href;
      if(!url||url.includes('/video/')||seen.has(url))return;seen.add(url);
      const img=a.querySelector('img'),title=link.getAttribute('title')||link.textContent.trim()||url;
      const d=document.createElement('div');d.className='card';
      const im=document.createElement('img');im.loading='lazy';im.src=img?(img.getAttribute('data-src')||img.src):'';
      const t=document.createElement('div');t.textContent=title;
      const s=document.createElement('div');s.className='badge';s.textContent='⬢ anime-hit';
      d.appendChild(im);d.appendChild(t);d.appendChild(s);d.onclick=()=>loadEps(url);g.appendChild(d);
    });
    if(!g.children.length)g.innerHTML='<p class="note">ไม่เจอใน anime-hit</p>';
  }catch(e){document.getElementById('results').innerHTML='<p class="note">anime-hit โหลดไม่ได้</p>';}
}
function webLink(url,title){
  const w=document.getElementById('webres');
  const a=document.createElement('a');a.href='#';
  a.textContent='['+hostOf(url)+'] '+title;a.title=url;
  a.onclick=ev=>{ev.preventDefault();EP=[];EPTITLE='';document.getElementById('u').value=url;setNow(title,-1);resolve();document.getElementById('v').scrollIntoView();};
  w.appendChild(a);
}
async function searchWeb(q){
  const w=document.getElementById('webres');
  document.getElementById('webhead').style.display='block';
  w.innerHTML='<p class="note">🔎 กำลังค้นทั่วเน็ต...</p>';
  // 2) Exa ผ่าน proxy ต้องมี key (Bing/Mojeek ใช้ไม่ได้ โดนบล็อก/ผลขยะ)
  if(!exaKey()){w.innerHTML='<p class="note">💡 อยากเห็นผลจาก 037HD / AnimePahe / เว็บอื่น → สมัคร key ฟรีที่ exa.ai แล้ววางด้านบน (จำในเครื่องนี้เท่านั้น)</p>';return;}
  try{
    const r=await fetch(PROXY+'https://api.exa.ai/search',{method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':exaKey()},
      body:JSON.stringify({query:q+' ดูฟรี ซับไทย พากย์ไทย',numResults:15})});
    const j=await r.json();w.innerHTML='';
    (j.results||[]).forEach(s=>webLink(s.url,s.title||s.url));
    if(!w.children.length)w.innerHTML='<p class="note">ไม่เจอผลเว็บ (เช็ก key)</p>';
  }catch(e){w.innerHTML='<p class="note">ค้นเว็บล้มเหลว (เช็ก key/เน็ต)</p>';}
}
async function loadEps(seriesUrl){
  const html=await pGet(seriesUrl),eps={};
  [...html.matchAll(/href="(https:\/\/(?:hit-anime|anime-hit)\.com\/video\/[^"]+)"/g)].forEach(m=>{
    const n=m[1].match(/-ep-(\d+)/);if(n&&!eps[+n[1]])eps[+n[1]]=m[1];});
  const t=html.match(/<title>([^<]+)<\/title>/);
  EPTITLE=t?t[1].split('|')[0].trim():seriesUrl;
  EP=Object.keys(eps).map(Number).sort((a,b)=>a-b).map(n=>({ep:n,url:eps[n]}));
  document.getElementById('epsec').style.display='block';
  document.getElementById('eptitle').textContent='📺 '+EPTITLE;
  document.getElementById('epcount').textContent='ทั้งหมด '+EP.length+' ตอน';
  renderEps();document.getElementById('epsec').scrollIntoView();
}
function renderEps(){
  const list=ASC?EP:[...EP].reverse();
  document.getElementById('ordbtn').textContent=ASC?'เรียง: เก่า → ใหม่':'เรียง: ใหม่ → เก่า';
  const box=document.getElementById('eps');box.innerHTML='';
  list.forEach(e=>{const b=document.createElement('button');b.textContent='EP.'+e.ep;b.onclick=()=>playEp(e,EP.indexOf(e));box.appendChild(b);});
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
document.getElementById('u').addEventListener('keydown',e=>{if(e.key==='Enter')resolve()});
</script></body></html>
